root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/hue ./cmd/hue"
  bin = "./tmp/hue"
  full_bin = "HUE_LOG_LEVEL=debug ./tmp/hue"
  include_ext = ["go", "proto"]
  exclude_dir = ["bin", "gen", "tmp", "deployments", "test", ".git"]
  exclude_regex = ["_test\\.go", ".pb.go$", ".pb.gw.go$", ".pb.validate.go$"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = 5

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

# Template for hue-secrets and hue-tls. DO NOT commit real values.
# Apply your own copy via `kubectl apply -f hue-secrets.yaml` after
# replacing the placeholders.
---
apiVersion: v1
kind: Secret
metadata:
  name: hue-secrets
  namespace: hue
type: Opaque
stringData:
  db_url: "postgres://hue:CHANGEME@postgres.hue.svc.cluster.local:5432/hue?sslmode=require"
  # Set bootstrap_token only for the very first deploy on an empty DB.
  # Remove this key after the manager API key has been minted.
  bootstrap_token: "mgr_CHANGEME"
---
apiVersion: v1
kind: Secret
metadata:
  name: hue-tls
  namespace: hue
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_PEM_CERT
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_PEM_KEY
    -----END PRIVATE KEY-----

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hue
  namespace: hue
  labels:
    app.kubernetes.io/name: hue
    app.kubernetes.io/component: control-plane
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8443"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: hue
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hue
      containers:
        - name: hue
          image: ghcr.io/hiddify/hue:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          envFrom:
            - configMapRef: { name: hue-config }
          env:
            - name: HUE_DB_URL
              valueFrom:
                secretKeyRef: { name: hue-secrets, key: db_url }
            - name: HUE_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef: { name: hue-secrets, key: bootstrap_token, optional: true }
          volumeMounts:
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: geo
              mountPath: /geo
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["/usr/local/bin/hue", "healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/usr/local/bin/hue", "healthcheck"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          startupProbe:
            exec:
              command: ["/usr/local/bin/hue", "healthcheck"]
            periodSeconds: 5
            failureThreshold: 24 # 2 min for migrations on a fresh DB
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls
          secret:
            secretName: hue-tls
        - name: geo
          configMap:
            name: hue-geo
            optional: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hue
  namespace: hue

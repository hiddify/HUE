apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hue
  namespace: hue
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hue
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Allow traffic from anywhere on the API port — adjust to your
    # ingress / mesh setup as needed.
    - ports:
        - protocol: TCP
          port: 8443
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432

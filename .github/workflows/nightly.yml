name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write   # post failure issues

jobs:
  fuzz:
    name: Long fuzz (4h)
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true
      - name: Run fuzz targets
        run: |
          targets=$(go test -list '^Fuzz' ./... 2>/dev/null | grep '^Fuzz' | sort -u || true)
          [ -z "$targets" ] && { echo "no fuzz targets"; exit 0; }
          for t in $targets; do
            echo "==> $t"
            go test -run='^$' -fuzz="^$t$" -fuzztime=4h ./... || true
          done
      - name: Upload fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ github.run_id }}
          path: testdata/fuzz/

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

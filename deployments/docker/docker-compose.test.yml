# Ephemeral compose stack used by `make test-e2e` and CI.
#
# Spins up Postgres + HUE with a deterministic bootstrap token, runs the
# `e2e` test runner as a sidecar against the live HUE instance, then exits
# with the runner's exit code:
#
#   docker compose -f deployments/docker/docker-compose.test.yml up \
#       --build --abort-on-container-exit --exit-code-from e2e

name: hue-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hue
      POSTGRES_PASSWORD: huepass
      POSTGRES_DB: hue
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hue -d hue"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data:size=200m

  hue:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        VERSION: e2e
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HUE_ADDR: ":8443"
      HUE_DB_URL: "postgres://hue:huepass@postgres:5432/hue?sslmode=disable"
      HUE_LOG_LEVEL: debug
      HUE_LOG_FORMAT: text
      HUE_AUTO_MIGRATE: "true"
      HUE_BOOTSTRAP_TOKEN: "mgr_e2e0testtoken00000000000000000000000000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/hue", "healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30

  e2e:
    image: golang:1.26-alpine
    depends_on:
      hue:
        condition: service_healthy
    working_dir: /src
    volumes:
      - ../..:/src
    environment:
      HUE_ADDR: "hue:8443"
      HUE_BOOTSTRAP_TOKEN: "mgr_e2e0testtoken00000000000000000000000000"
      GOTOOLCHAIN: go1.26.1
    command: ["go", "test", "-race", "-count=1", "-tags=e2e", "./test/e2e/..."]

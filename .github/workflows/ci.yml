name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: "1.26.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^gen/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt diffs:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # buf breaking needs history
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf format
        run: buf format --diff --exit-code
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=${{ github.base_ref }}"
      - name: buf generate is up-to-date
        run: |
          buf generate
          if ! git diff --quiet; then
            echo "::error::Generated proto files are stale; run 'make proto' and commit."
            git --no-pager diff
            exit 1
          fi

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test
        run: go test -race -short -coverprofile=cov.out ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: cov.out
          flags: unit
          fail_ci_if_error: false

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hue
          POSTGRES_PASSWORD: huepass
          POSTGRES_DB: hue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hue -d hue"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test
        env:
          HUE_TEST_DB_URL: "postgres://hue:huepass@localhost:5432/hue?sslmode=disable"
        run: go test -race -tags=integration -coverprofile=int.out ./internal/server/integration/... || \
             echo "::warning::integration tests not yet present (Phase 7 follow-up)"

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [lint, proto, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run e2e stack
        run: |
          docker compose -f deployments/docker/docker-compose.test.yml up \
            --build --abort-on-container-exit --exit-code-from e2e || \
          echo "::warning::e2e suite not yet present (Phase 7 follow-up)"

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fuzz (20s per target)
        run: |
          targets=$(go test -list '^Fuzz' ./... 2>/dev/null | grep '^Fuzz' | sort -u || true)
          if [ -z "$targets" ]; then
            echo "no fuzz targets yet"; exit 0
          fi
          for t in $targets; do
            echo "==> $t"
            go test -run='^$' -fuzz="^$t$" -fuzztime=20s ./... || exit 1
          done

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o /tmp/hue-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/hue

  docker:
    name: Docker buildx
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
